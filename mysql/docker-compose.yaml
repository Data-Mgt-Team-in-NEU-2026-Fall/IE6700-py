name: neu-ie6700-mysql

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ie6700_local_root}
      MYSQL_ROOT_HOST: "%"
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./archive:/workspace/archive:ro,z
      - ./marketplace.sql:/workspace/marketplace.sql:ro,z
      - ./seed:/workspace/seed:ro,z
      - ./queries.sql:/workspace/queries.sql:ro,z
      - ./delete_rules.sql:/workspace/delete_rules.sql:ro,z
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysql --protocol=TCP --host=127.0.0.1 --user=root --execute='SELECT 1' >/dev/null 2>&1
      interval: 3s
      timeout: 5s
      start_period: 20s
      retries: 40
    stop_grace_period: 30s

volumes:
  mysql_data:
